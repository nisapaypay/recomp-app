<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>Offline · Recomp Nisa</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f7f6f3; color: #1f1d24;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
      main { max-width: 26rem; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.25rem; }
      p { color: #6e6a77; margin: 0.5rem 0; }
      button { margin-top: 1.25rem; min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 12px; background: #5d3fbb;
        color: #fff; font: 600 1rem/1 inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Recomp Nisa keeps your data in your account, so this page needs a connection to load.</p>
      <p>Nothing has been saved or changed while you were offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
